adventure:
  no_free_input: |
    🗺️ Приключения больше не ждут тебя.

    Все входы на локации заняты, но мир велик — есть ещё тысячи неизведанных путей, которые пока закрыты для тебя.

    🔒 Попробуй позже. Возможно, кто-то обнаружит новый маршрут, и тебе откроется путь.
  
  no_energy: |
    ⚡ У тебя не хватает энергии для путешествия.

    Отдохни немного — энергия восстанавливается со временем. Вернись, когда будешь готов к подвигам.
  
  no_adventure_for_user: |
    🌿 Авантюрист? Где твои следы?

    Ты ещё не ступал на эти тропы. Пора собраться и отправиться в путь!
  
  adventure_in_progress: |
    🗺️ Ты уже в пути, герой!

    Нельзя идти на новое приключение, пока не завершишь текущее. Соберись с духом и доведи дело до конца.
  
  no_bosses_available: |
    👻 Странно... Здесь царит непривычная тишина.

    Ни один босс не откликнулся на твой вызов. Возможно, они все куда-то делись, или тебе просто не повезло. Попробуй снова чуть позже!
  
  must_duel_first: |
    ⚔️ Чтобы войти в эту локацию, нужно пройти испытание — дуэль с жадным хуекрабом.

    Победи его, и двери этих земель откроются перед тобой. Удачи!
  
  low_hp_warning: |
    🚨 Твоё здоровье на исходе!

    Если хп упадёт до нуля — ты потеряешь часть добычи. Будь осторожен и спеши на выход, пока не поздно!
  
  adventure_not_found: |
    ❌ Приключение не найдено. Возможно, оно уже закончилось или не существует.
  
  adventure_already_finished: |
    ✅ Это приключение уже завершено. Возможно, пришло время для нового подвига?
  
  victory: |
    🏆 Поздравляем! Ты победил {{boss_name}}!

    ⚡ Здоровье: осталось {{hp}}/{{max_hp}}
    💰 Добыча: {{gold}} репутации
    🎁 Выпало: {{items}}
    
    Твоё имя станет легендой этих земель!
  
  defeat: |
    💀 Тебя одолел {{boss_name}}...

    Ты вынужден отступить, потеряв часть добычи и чести. Но не сдавайся — настоящий герой всегда возвращается!
  
  boss_defeated_broadcast: |
    🎉 {{user_link}} одержал победу над {{boss_name}} в локации {{location_name}}!

    Этот подвиг войдёт в летопись приключений!
  
  adventure_over: |
    🏁 Приключение завершено!

    Накопленное золото переведено в репутацию. До встречи в новых землях!
  
  location_unlocked: |
    🔓 Новая локация открыта!

    Теперь тебе доступен: {{location_name}}
    {{description}}
  
  reward_summary: |
    💰 Итоги приключения:
    Золото собрано: {{gold}}
    Репутация получена: {{reputation}}
    Предметы найдены: {{items}}
  
  available_actions:
    attack: "🗡️ Атаковать"
    defend: "🛡️ Защищаться"
    use_item: "🎒 Использовать предмет"
    flee: "🏃 Сбежать"
    inventory: "🎒 Инвентарь"
  
  adventure_title: "🗺️ Приключение: {{location_name}}"
  current_hp: "❤️ ХП: {{current}}/{{max}}"
  boss_encounter: "👹 Ты встретил {{boss_name}}! (Урон: {{damage}}, Защита: {{defense}})"
  select_action: "Выбери действие:"
  attack_result: "⚔️ Ты нанёс {{damage}} урона! У босса осталось {{boss_hp}} ХП."
  boss_attack: "💥 {{boss_name}} нанёс {{damage}} урона! У тебя осталось {{player_hp}} ХП."
  defend_result: "🛡️ Ты защищаешься! Получаемый урон снижен."
  flee_attempt: "🏃 Ты пытаешься сбежать..."
  flee_success: "✅ Ты успешно сбежал! Золото сохранено, но босс остался жив."
  flee_fail: "❌ Тебе не удалось сбежать! Босс атакует."
  item_used: "🎒 Использован предмет: {{item_name}}. Эффект: {{effect}}"

notifications:
  adventure_started: "🎒 Новое приключение началось: {{location_name}}!"
  adventure_finished: "🏁 Приключение завершено: {{location_name}}!"
  boss_spawned: "👹 В {{location_name}} появился {{boss_name}}!"
  boss_defeated: "🏆 {{boss_name}} повержен в {{location_name}}!"

