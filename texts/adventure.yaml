# Specific mobs for Dark Forest
bush_with_requirements_name: "🌳Куст с предъявами"
bush_with_requirements_desc: |
  Просто куст. Но он шуршит так, что гном инстинктивно прикрывает пах. 
  Из куста выглядывает пара красных глаз и слышится голос: «А ну покажи, что там у тебя, пездюк!». 
  Если кусту не понравится размер — куст бьет веткой по рукам.
  
  <b>Тактика:</b> Низкий урон, но с шансом 30% вешает дебафф «Паранойя» (гном может пропустить ход, проверяя ширинку).
  
  ❤️ HP: 30
  ⚔️ Урон: 5
  📊 Уровень: 1

head_on_spider_legs_name: "🕷️Голова деда на паучьих ногах"
head_on_spider_legs_desc: |
  Размером с таксу. У него морщинистое лицо, он постоянно что-то пиздит и пытается впиться жвалами в шею гнома.
  
  <b>Тактика:</b> Больно кусает. Если не убить за 3 хода — присасывается и высасывает дополнительно по 5 ХП каждый ход.
  
  ❤️ HP: 20
  ⚔️ Урон: 8
  📊 Уровень: 1

# Special abilities
ability_paranoida: |
  <b>🌀 Паранойя</b>
  Гном пропускает ход, проверяя ширинку
  
ability_suck: |
  <b>🩸 Присасывание</b>
  Моб присасывается и высасывает по 5 ХП каждый ход

