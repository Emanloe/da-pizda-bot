adventure:
  welcome: |
    🗺️ <b>Доступные локации</b>
    Выберите, куда отправитесь:

  location_info: |
    📍 <b>{name}</b>
    {desc}

  back: "◀️ Назад"
  fight: "⚔️ В бой!"
  cancel: "❌ Отмена"
  cancelled: "Отменено."
  unknown: "Неизвестная команда. Попробуйте снова."
  no_bosses: "В этой локации пока нет боссов."

  cooldown: |
    ⏳ Вы недавно сражались.
    Подождите ещё {minutes} мин.

  not_enough_gold: |
    💰 Недостаточно золота.
    Требуется: {price}

  low_hp_warning: |
    ⚠️ У вас мало здоровья: {hp} HP!

  confirm_fight: |
    ⚔️ <b>{boss_name}</b>
    💰 Цена: {price}
    ❤️ HP босса: {hp}
    💣 Шанс крита: {crit}%

    Начать бой?

  victory: |
    🏆 <b>Победа!</b>
    Повержен: {boss_name}
    Раундов: {rounds}
    ❤️ Ваше HP: {hp_left}

    🎒 Лут:
    {loot}

    ⭐ Опыт: +{xp}

  defeat: |
    💀 <b>Поражение...</b>
    Вас одолел: {boss_name}
    Раундов: {rounds}
    ❤️ Ваше HP: {hp_left}

  already_full_hp: "❤️ У вас полное здоровье!"

  healed: |
    ❤️‍🩹 Восстановлено полное здоровье!
    💰 Потрачено: {cost} золота

  no_loot: "Ничего не найдено."

  low_level: |
    🔒 Требуется уровень {level}
    Прокачайтесь, чтобы открыть эту локацию.

  # Fallback / legacy keys
  result: |
    🏆 <b>Результаты приключения</b> 🏆
    Результат: {result}
    Опыт: +{xp}
    Золото: +{gold}
